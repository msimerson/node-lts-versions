name: Node LTS versions
author: Matt Simerson
description: Get list of LTS node.js versions
runs:
  using: 'node24'
  main: 'dist/index.js'
outputs:
  lts:
    description: maintained LTS versions
  active:
    description: active LTS versions
  maintenance:
    description: all non-EOL versions (current + LTS)
  current:
    description: current (non-LTS) version, or highest maintenance version if between release cycles
  min:
    description: the lowest LTS version
